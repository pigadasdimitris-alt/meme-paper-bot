name: diag

# Διάγνωση πώλησης token (μόνο ανάγνωση).
on:
  workflow_dispatch:
    inputs:
      mint: {required: true}
      pool: {required: true}

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q solders mnemonic
      - name: Diag
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SOLANA_ADDRESS_HINT: "6zAx…gyjn"
        run: python -m bot.diag "${{ inputs.mint }}" "${{ inputs.pool }}"
      - name: Save result
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs/diag.json || true
          git commit -q -m "diag" || true
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 3; done
