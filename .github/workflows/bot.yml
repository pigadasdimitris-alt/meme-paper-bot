name: paper-bot

on:
  schedule:
    - cron: "7 * * * *"        # κάθε ώρα· κάθε γύρος τρέχει ~55 λεπτά
  workflow_dispatch: {}          # χειροκίνητη εκκίνηση από το κινητό (Actions → Run workflow)
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/**", "tests/**"]

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false      # ποτέ δύο bots ταυτόχρονα

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          pip install -q pytest
          python -m pytest -q

      - name: Run bot (paper only)
        env:
          RUN_MINUTES: "55"
          COMMIT_EVERY: "10"
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          python -m bot.run
