name: paper-bot

# Το bot τρέχει συνεχόμενα: κάθε γύρος διαρκεί ~5,5 ώρες και στο τέλος ξεκινά μόνος του τον επόμενο.
# Το cron είναι απλώς εφεδρικό (το GitHub συχνά καθυστερεί ή παραλείπει προγραμματισμένα runs).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/**", "tests/**"]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: paper-bot
  cancel-in-progress: false      # ποτέ δύο bots ταυτόχρονα· ο επόμενος περιμένει στη σειρά

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          pip install -q pytest solders mnemonic
          python -m pytest -q

      - name: Run bot (paper only)
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SOLANA_ADDRESS_HINT: "6zAx…gyjn"
          GITHUB_TOKEN: ${{ github.token }}
          RUN_MINUTES: "330"
          COMMIT_EVERY: "2"
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          python -m bot.run

      - name: Start next round
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main
