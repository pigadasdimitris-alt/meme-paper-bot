name: fetch-data

# Κατεβάζει δημόσια ιστορικά δεδομένα Binance (κεριά, funding, OI) στο branch "data" για τα backtests.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download
        run: python research/fetch_binance.py /tmp/data
      - name: Push to data branch
        run: |
          cd /tmp/data
          git init -q -b data
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A && git commit -q -m "binance data $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
          ls -la
