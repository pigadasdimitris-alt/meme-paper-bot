name: live-smoke-test

# Χειροκίνητη δοκιμή: αγορά ~1$ USDC και πώληση πίσω, για να επιβεβαιωθεί ότι το live δουλεύει.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q solders mnemonic
      - name: Smoke test
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SOLANA_ADDRESS_HINT: "6zAx…gyjn"
        run: python -m bot.smoke
      - name: Save result
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs/live_smoke.json || true
          git commit -q -m "live smoke test" || true
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 3; done
