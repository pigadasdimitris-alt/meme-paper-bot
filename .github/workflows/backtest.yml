name: backtest

# Backtest των meme στρατηγικών σε ιστορικά κεριά (μόνο ανάγνωση δημόσιων δεδομένων, κανένα κλειδί).
on:
  workflow_dispatch:
    inputs:
      days: {description: "Πόσες μέρες πίσω", default: "10"}
      max_pools: {description: "Μέγιστος αριθμός coins", default: "150"}

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backtest
        env:
          BT_DAYS: ${{ inputs.days }}
          BT_MAX_POOLS: ${{ inputs.max_pools }}
        run: python research/backtest.py
      - name: Save result
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs/backtest.json
          git commit -q -m "backtest" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
