name: payout-test

# Δοκιμαστική μεταφορά ~1$ στο Revolut.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q solders mnemonic
      - name: Payout test
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SOLANA_ADDRESS_HINT: "6zAx…gyjn"
        run: python -m bot.payout_test
      - name: Save result
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs/payout_test.json || true
          git commit -q -m "payout test" || true
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 3; done
