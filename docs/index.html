<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Bot</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paper Bot">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050607">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a live trading desk at 3am — quiet black, every event lights up
   IDEA: an operations desk of six agents passing each coin down a pipeline
   PICTURE: big equity with multiplier, glowing curve, agents that pulse, a console that streams
   COLOUR: matte black, mint for profit/pass, coral for loss/kill, per-agent accent dots
   TYPE: Inter for UI, JetBrains Mono for figures and the console */
:root{
  --bg:#050607; --card:#0e1013; --card2:#13161a; --line:#1d2127; --line2:#2a3038;
  --ink:#f4f6f8; --ink2:#b3bac4; --muted:#6c7480;
  --up:#34d399; --up2:rgba(52,211,153,.13); --down:#f87171; --down2:rgba(248,113,113,.13);
  --gold:#fbbf24; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,system-ui,sans-serif;overflow-x:clip;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 48px max(12px,env(safe-area-inset-left))}
body::before{content:"";position:fixed;inset:-20% -20% auto;height:420px;background:radial-gradient(closest-side,rgba(52,211,153,.13),transparent);pointer-events:none;z-index:-1}
.wrap{max-width:880px;margin:0 auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink2)} .mut{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.hd h2{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.hd .note{font-size:12px;color:var(--muted)}
.badge{font:600 11.5px var(--mono);padding:3px 8px;border-radius:99px}
.badge.r{background:var(--down2);color:var(--down)} .badge.g{background:var(--up2);color:var(--up)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:#111418;border:1px solid var(--line2);display:grid;place-items:center}
.logo svg{width:20px;height:20px}
.bt b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.bt span{font-size:11.5px;color:var(--muted)}
.live{display:flex;align-items:center;gap:7px;font:600 12px Inter,system-ui,sans-serif;padding:6px 11px;border-radius:99px;background:var(--up2);color:var(--up)}
.live.warn{background:rgba(251,191,36,.12);color:var(--gold)} .live.bad{background:var(--down2);color:var(--down)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

/* hero */
.hero{padding:16px 14px 8px;background:linear-gradient(180deg,#101317,#0b0d10)}
.hrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.eq{font:700 clamp(38px,10.5vw,58px)/1.02 var(--mono);letter-spacing:-.035em}
.sub{font:600 14px var(--mono);margin-top:6px}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{font:700 15px var(--mono);padding:7px 11px;border-radius:12px;background:var(--line);white-space:nowrap;transition:background .4s,color .4s}
.pill small{display:block;font:500 10.5px Inter,system-ui,sans-serif;color:var(--muted);text-align:right}
.pill.g{background:var(--up2);color:var(--up)} .pill.r{background:var(--down2);color:var(--down)}
.pill.flip{animation:flip .6s}
@keyframes flip{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.tabs{display:flex;gap:4px;margin:12px 0 0;background:#0a0c0e;border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content}
.tabs button{all:unset;cursor:pointer;font:600 12px Inter,system-ui,sans-serif;color:var(--muted);padding:6px 11px;border-radius:7px}
.tabs button.on{background:var(--card2);color:var(--ink)}
.chartbox{position:relative;height:170px;margin:6px -4px 0}
.chartbox svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* funnel */
.funnel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
.fc span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.fc b{display:block;font:700 clamp(20px,6vw,26px) var(--mono);letter-spacing:-.02em;margin-top:2px}

/* agents */
.agent{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;align-items:center;padding:9px 8px;border-radius:12px;transition:background .5s}
.agent+.agent{margin-top:2px}
.agent .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent)}
.agent .ic svg{width:17px;height:17px;stroke:var(--c)}
.agent .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.agent .nm i{width:6px;height:6px;border-radius:50%;background:var(--c);opacity:.35;transition:opacity .3s}
.agent .ds{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent .st{text-align:right;font:600 12.5px var(--mono);color:var(--ink2)}
.agent.hit{background:color-mix(in srgb,var(--c) 12%,transparent)}
.agent.hit .nm i{opacity:1;box-shadow:0 0 10px var(--c)}

/* console */
.console{background:#07080a;border:1px solid var(--line);border-radius:12px;padding:10px 11px;font:12px/1.7 var(--mono);height:230px;overflow:auto}
.ln{display:flex;gap:8px;white-space:nowrap}
.ln .t{color:var(--muted);flex:none}
.ln .a{flex:none;font-weight:700}
.ln .m{overflow:hidden;text-overflow:ellipsis}
.ln.new{animation:slide .5s ease-out both}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* rules grid */
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rule{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 11px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.rule span{font-size:12.5px;color:var(--ink2);line-height:1.3}
.rule b{font:700 15px var(--mono);color:var(--down)}

/* open positions */
.pos{padding:11px 0;border-top:1px solid var(--line)}
.pos:first-child{border-top:0;padding-top:0}
.prow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pname{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:12px;color:var(--muted)}
.big{font:700 18px var(--mono)}
.track{position:relative;height:7px;border-radius:99px;margin:11px 0 6px;background:linear-gradient(90deg,var(--down2),var(--line) 35%,var(--line) 65%,var(--up2))}
.track .zero{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--line2)}
.track .peak{position:absolute;top:-2px;width:2px;height:11px;background:var(--gold);opacity:.8}
.track .cur{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--bg);box-shadow:0 0 12px currentColor;transition:left .8s}
.tlbl{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--muted)}

/* gauges */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.g{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.g .v{font:700 19px var(--mono);letter-spacing:-.02em}
.g .k{font-size:12px;color:var(--muted);font-weight:600}
.bars{position:relative;height:140px}
.bars svg{position:absolute;inset:0;width:100%;height:100%}

/* history */
.filters{display:flex;gap:6px}
.filters button{all:unset;cursor:pointer;font:600 12px Inter,system-ui,sans-serif;padding:6px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink2)}
.filters button.on{background:var(--line);color:var(--ink)}
.tr{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}
.tr .sd{align-self:stretch;border-radius:4px;background:var(--line2)}
.tr.w .sd{background:var(--up)} .tr.l .sd{background:var(--down)}
.tr .r{text-align:right} .tr .r .num{display:block;font-weight:700}
.more{all:unset;cursor:pointer;display:block;width:100%;text-align:center;font:600 13px Inter,system-ui,sans-serif;color:var(--ink2);padding:10px 0 2px}
.empty{color:var(--muted);font-size:14px;padding:4px 2px}

/* toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top));z-index:9;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:rgba(17,20,24,.96);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .45s ease-out both}
.toast.out{animation:tout .4s ease-in both}
.toast .tic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.toast .tic svg{width:16px;height:16px}
.toast b{font-size:13.5px} .toast span{display:block;font-size:12px;color:var(--ink2)}
.toast .amt{margin-left:auto;font:700 15px var(--mono)}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

.err{background:var(--down2);color:var(--down);padding:10px 12px;border-radius:12px;font-size:13px;margin-bottom:10px;display:none}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.7}
footer a{color:var(--ink2)}
.tabs button:focus-visible,.filters button:focus-visible,.more:focus-visible{outline:2px solid var(--up)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="toasts" id="toasts"></div>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-9"/><path d="M15 6h5v5"/></svg></div>
      <div class="bt"><b>Paper Bot</b><span>Solana meme desk · paper</span></div>
    </div>
    <div class="live" id="live"><span class="dot"></span><span id="livet">Σύνδεση…</span></div>
  </div>

  <div class="err" id="err"></div>

  <section class="card hero">
    <div class="hrow">
      <div>
        <div class="eq num" id="eq">—</div>
        <div class="sub num" id="sub"></div>
      </div>
      <div class="pills">
        <div class="pill" id="mult"><small>πολλαπλασιαστής</small><span>—</span></div>
        <div class="pill" id="lastp"><small>τελευταίο trade</small><span>—</span></div>
      </div>
    </div>
    <div class="tabs" id="tabs"><button data-r="6">6ω</button><button data-r="24">24ω</button><button data-r="0" class="on">Όλα</button></div>
    <div class="chartbox"><svg id="curve"></svg></div>
  </section>

  <div class="funnel">
    <div class="fc"><span>Σαρώθηκαν</span><b class="num" id="fScan">0</b></div>
    <div class="fc"><span>Απορρίφθηκαν</span><b class="num down" id="fRej">0</b></div>
    <div class="fc"><span>Πέρασαν</span><b class="num up" id="fPass">0</b></div>
  </div>

  <section class="card">
    <div class="hd"><h2>Desk · 6 agents</h2><span class="note" id="deskNote"></span></div>
    <div id="agents"></div>
  </section>

  <section class="card">
    <div class="hd"><h2>Ανοιχτά τώρα</h2><span class="note" id="openNote"></span></div>
    <div id="open"></div>
  </section>

  <section class="card">
    <div class="hd"><h2>Logger</h2><span class="badge r" id="killed">0 killed</span></div>
    <div class="console" id="console"></div>
  </section>

  <section class="card">
    <div class="hd"><h2>Killed by rule</h2><span class="note num" id="bw"></span></div>
    <div class="rules" id="rules"></div>
  </section>

  <div class="grid" id="gauges"></div>

  <section class="card">
    <div class="hd"><h2>Αποτέλεσμα ανά trade</h2><span class="note">τελευταία 40</span></div>
    <div class="bars"><svg id="pnlbars"></svg></div>
  </section>

  <section class="card">
    <div class="hd"><h2>Ιστορικό</h2>
      <div class="filters" id="filters"><button data-f="all" class="on">Όλα</button><button data-f="w">Κέρδη</button><button data-f="l">Ζημιές</button></div></div>
    <div id="closed"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
{
const OWNER = "pigadasdimitris-alt", REPO = "meme-paper-bot";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/docs/state.json?ref=main`;
const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/docs/state.json`;
const LOCAL = location.hash === "#local";
const SLIP = 0.025, FEE = 0.03, TP = 30, POLL = 75000;
const $ = id => document.getElementById(id);
const tz = "Europe/Athens";
const T = s => new Date(s).getTime();
const fT = s => s ? new Date(s).toLocaleString("el-GR",{timeZone:tz,day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
const fH = s => s ? new Date(s).toLocaleTimeString("el-GR",{timeZone:tz,hour:"2-digit",minute:"2-digit"}) : "—";
const usd = v => (v>0?"+":v<0?"−":"") + "$" + Math.abs(v).toFixed(2);
const pct = v => (v>0?"+":v<0?"−":"") + Math.abs(v).toFixed(1) + "%";
const cls = v => v>0.004 ? "up" : v<-0.004 ? "down" : "flat";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtInt = n => Math.round(n).toLocaleString("el-GR");
let ST = null, PREV = null, range = 0, filt = "all", showAll = false, first = true;

const posValue = p => Math.max(p.qty*p.last_price*(1-SLIP)-FEE, 0);
const equity = st => st.balance + st.positions.reduce((a,p)=>a+posValue(p),0);

/* ---------- animated numbers ---------- */
const shown = {};
function tick(id, to, fmt){
  const el = $(id), from = shown[id] ?? 0; shown[id] = to;
  if(first || from === to){ el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 1100;
  const step = now => { const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
    el.textContent = fmt(from + (to-from)*e); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- agents ---------- */
const ICONS = {
  scout:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/>',
  filter:'<path d="M3 4h18l-7 8v6l-4 2v-8z"/>',
  guard:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  exec:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  risk:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
  logger:'<path d="M5 4h14v16H5zM9 8h6M9 12h6M9 16h3"/>'
};
function agentData(st){
  const rj = Object.entries(st.stats.rejects||{}), rejected = rj.reduce((a,[,n])=>a+n,0);
  const buys = st.log.filter(l=>l.msg.startsWith("ΑΓΟΡΑ")), sells = st.log.filter(l=>l.msg.startsWith("ΠΩΛΗΣΗ"));
  const lastBuy = buys[buys.length-1], lastSell = sells[sells.length-1];
  const lastExec = [lastBuy,lastSell].filter(Boolean).sort((a,b)=>T(b.t)-T(a.t))[0];
  const sus = st.log.filter(l=>/ύποπτη|διαφωνούν/.test(l.msg)).length + (st.stats.rejects?.["ύποπτο contract"]||0) + (st.stats.rejects?.["ασυμφωνία τιμών"]||0);
  const stops = st.closed.filter(t=>/stop/.test(t.reason)).length, rugs = st.closed.filter(t=>/ρευστότητα|rug/.test(t.reason)).length;
  const topRule = rj.sort((a,b)=>b[1]-a[1])[0];
  const dayLimit = st.daily.realized <= -15;
  return [
    {k:"scout", n:"Scout", c:"#60a5fa", d:`Νέα pools + trending · ${Object.keys(st.watch||{}).length} σε παρακολούθηση`, s:`${fmtInt(st.stats.pools_checked)} σαρώσεις`, v:st.stats.pools_checked},
    {k:"filter", n:"Filter", c:"#22d3ee", d: topRule ? `Συχνότερο: ${topRule[0]}` : "Ρευστότητα, όγκος, ορμή, ηλικία", s:`${rejected} ✕ · ${st.closed.length+st.positions.length} ✓`, v:rejected},
    {k:"guard", n:"Guard", c:"#a78bfa", d:"Έλεγχος contract + 2 πηγές τιμής", s:`${sus} μπλοκ`, v:sus},
    {k:"exec", n:"Executor", c:"#34d399", d: lastExec ? lastExec.msg.replace(/^#?\d+\s*/,"") : "Περιμένει σήμα", s:`${buys.length} αγορές`, v:buys.length+sells.length},
    {k:"risk", n:"Risk", c:"#f472b6", d: dayLimit ? "Όριο ημέρας — σταματημένες αγορές" : `Stop −15% · στόχος +30% · ${st.positions.length}/4 θέσεις`, s:`${stops} stops · ${rugs} rug`, v:stops+rugs},
    {k:"logger", n:"Logger", c:"#c084fc", d:"Καταγράφει κάθε κίνηση με λόγο", s:`${st.log.length} logs`, v:st.log.length},
  ];
}
function renderAgents(st){
  const A = agentData(st), prevA = PREV ? Object.fromEntries(agentData(PREV).map(a=>[a.k,a.v])) : {};
  $("agents").innerHTML = A.map(a=>`<div class="agent" id="ag-${a.k}" style="--c:${a.c}">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[a.k]}</svg></div>
    <div><div class="nm"><i></i>${a.n}</div><div class="ds">${esc(a.d)}</div></div>
    <div class="st">${esc(a.s)}</div></div>`).join("");
  $("deskNote").textContent = `κύκλος ${fmtInt(st.stats.scans)}`;
  // pulse agents whose counters moved since last update
  let delay = 0;
  for(const a of A){
    if(PREV && prevA[a.k] !== a.v){
      const el = $("ag-"+a.k);
      setTimeout(()=>{ el.classList.add("hit"); setTimeout(()=>el.classList.remove("hit"), 1600); }, delay);
      delay += 350;
    }
  }
}

/* ---------- console ---------- */
function agentOf(m){
  if(m.startsWith("ΑΓΟΡΑ")) return ["EXECUTOR","#34d399"];
  if(m.startsWith("ΠΩΛΗΣΗ")) return /—\s-\d/.test(m) ? ["EXECUTOR","#f87171"] : ["EXECUTOR","#34d399"];
  if(/ύποπτη|διαφωνούν/.test(m)) return ["GUARD","#a78bfa"];
  if(/Σφάλμα|Δεν ήρθαν/.test(m)) return ["SYSTEM","#fbbf24"];
  return ["LOGGER","#c084fc"];
}
function renderConsole(st){
  const prevN = PREV ? PREV.log.length : st.log.length;
  const prevLast = PREV && PREV.log.length ? T(PREV.log[PREV.log.length-1].t) : Infinity;
  const lines = st.log.slice(-120).reverse();
  $("console").innerHTML = lines.map((l,i)=>{
    const [ag,col] = agentOf(l.msg), isNew = PREV && T(l.t) > prevLast;
    return `<div class="ln${isNew?" new":""}" style="${isNew?`animation-delay:${i*0.12}s`:""}"><span class="t">${fH(l.t)}</span><span class="a" style="color:${col}">${ag}</span><span class="m">${esc(l.msg)}</span></div>`;
  }).join("") || `<div class="ln"><span class="m mut">Αναμονή για την πρώτη κίνηση…</span></div>`;
  const rj = Object.values(st.stats.rejects||{}).reduce((a,n)=>a+n,0);
  $("killed").textContent = `${fmtInt(rj)} killed`;
}

/* ---------- toasts for new trades ---------- */
function toast(kind, title, sub, amt){
  const col = kind==="buy" ? "#60a5fa" : kind==="win" ? "#34d399" : "#f87171";
  const icon = kind==="buy" ? '<path d="M12 19V5M5 12l7-7 7 7"/>' : kind==="win" ? '<path d="M5 13l4 4L19 7"/>' : '<path d="M6 6l12 12M18 6L6 18"/>';
  const el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `<div class="tic" style="background:${col}22"><svg viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${icon}</svg></div>
    <div><b>${esc(title)}</b><span>${esc(sub)}</span></div><div class="amt" style="color:${kind==="buy"?"var(--ink)":col}">${esc(amt)}</div>`;
  $("toasts").prepend(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(), 450); }, 5200);
}
function announce(st){
  if(!PREV) return;
  const seenOpen = new Set(PREV.positions.map(p=>p.id)), seenClosed = new Set(PREV.closed.map(t=>t.id));
  let n = 0;
  for(const p of st.positions) if(!seenOpen.has(p.id) && !seenClosed.has(p.id) && n<4){ setTimeout(()=>toast("buy",`Αγορά · ${p.name}`,`#${p.id} · ${fH(p.entry_time)}`,"$10.00"), n++*700); }
  for(const t of st.closed) if(!seenClosed.has(t.id) && n<6){ setTimeout(()=>toast(t.pnl>0?"win":"loss",`Πώληση · ${t.name}`,t.reason,usd(t.pnl)), n++*700); }
}

/* ---------- charts ---------- */
function drawCurve(){
  const svg = $("curve"); if(!ST) return;
  const W = svg.clientWidth, H = svg.clientHeight; if(!W) return;
  let h = ST.equity_history;
  if(range){ const cut = Date.now()-range*3600e3; h = h.filter(x=>T(x[0])>=cut); }
  if(h.length < 2){ svg.innerHTML = `<text x="${W/2}" y="${H/2}" fill="#6c7480" font-size="13" text-anchor="middle" font-family="Inter,system-ui,sans-serif">Λίγα δεδομένα ακόμα</text>`; return; }
  const start = ST.start_balance, ys = h.map(x=>x[1]).concat(range?[]:[start]);
  let lo = Math.min(...ys), hi = Math.max(...ys); const pad=(hi-lo)*.14||1; lo-=pad; hi+=pad;
  const t0 = T(h[0][0]), t1 = T(h[h.length-1][0]);
  const L=4, R=W-40, top=8, bot=H-20;
  const x = t => L + (t-t0)/Math.max(t1-t0,1)*(R-L), y = v => bot - (v-lo)/(hi-lo)*(bot-top);
  const pts = h.map(p=>[x(T(p[0])), y(p[1])]);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join("");
  const last = h[h.length-1][1], base = range ? h[0][1] : start, col = last>=base ? "#34d399" : "#f87171";
  const lp = pts[pts.length-1], nt = W<520 ? 3 : 5, xt = [];
  for(let i=0;i<nt;i++){ const t=t0+(t1-t0)*i/(nt-1); xt.push(`<text x="${x(t)}" y="${H-3}" fill="#6c7480" font-size="10.5" font-family="JetBrains Mono,monospace" text-anchor="${i===0?"start":i===nt-1?"end":"middle"}">${fH(new Date(t).toISOString())}</text>`); }
  const ticks = [hi-pad,(hi+lo)/2,lo+pad];
  svg.innerHTML = `<defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient>
   <filter id="gl" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
   ${ticks.map(v=>`<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="#1d2127"/><text x="${W-1}" y="${y(v)+4}" fill="#6c7480" font-size="10.5" font-family="JetBrains Mono,monospace" text-anchor="end">$${v.toFixed(0)}</text>`).join("")}
   ${!range && start>lo && start<hi ? `<line x1="${L}" x2="${R}" y1="${y(start)}" y2="${y(start)}" stroke="#b3bac4" stroke-opacity=".4" stroke-dasharray="3 5"/>` : ""}
   <path d="${d}L${lp[0]},${bot}L${pts[0][0]},${bot}Z" fill="url(#gf)"/>
   <path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" filter="url(#gl)"/>
   <circle cx="${lp[0]}" cy="${lp[1]}" r="9" fill="${col}" opacity=".25"><animate attributeName="r" values="5;12;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0;.35" dur="2s" repeatCount="indefinite"/></circle>
   <circle cx="${lp[0]}" cy="${lp[1]}" r="4.5" fill="${col}" stroke="#050607" stroke-width="2"/>${xt.join("")}`;
}
function drawBars(){
  const svg = $("pnlbars"); if(!ST) return;
  const W = svg.clientWidth, H = svg.clientHeight; if(!W) return;
  const c = ST.closed.slice(-40);
  if(!c.length){ svg.innerHTML = `<text x="${W/2}" y="${H/2}" fill="#6c7480" font-size="13" text-anchor="middle" font-family="Inter,system-ui,sans-serif">Δεν έχει κλείσει trade ακόμα</text>`; return; }
  const m = Math.max(...c.map(t=>Math.abs(t.pnl)), 1), mid = H/2;
  const bw = Math.min(20, (W-8)/c.length - 3), gap = (W - bw*c.length)/(c.length+1);
  svg.innerHTML = `<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="#2a3038"/>` + c.map((t,i)=>{
    const hgt = Math.max(2, Math.abs(t.pnl)/m*(mid-14)), X = gap + i*(bw+gap), Y = t.pnl>0 ? mid-hgt : mid;
    return `<rect x="${X.toFixed(1)}" y="${Y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="3" fill="${t.pnl>0?"#34d399":"#f87171"}" opacity=".9"/>`;
  }).join("") + `<text x="2" y="11" fill="#6c7480" font-size="10.5" font-family="JetBrains Mono,monospace">+$${m.toFixed(2)}</text><text x="2" y="${H-3}" fill="#6c7480" font-size="10.5" font-family="JetBrains Mono,monospace">−$${m.toFixed(2)}</text>`;
}

/* ---------- lists ---------- */
function renderOpen(st){
  $("openNote").textContent = st.positions.length ? `${st.positions.length}/4 · $${st.positions.reduce((a,p)=>a+posValue(p),0).toFixed(2)}` : "";
  $("open").innerHTML = st.positions.length ? st.positions.map(p=>{
    const lo = Math.min(p.stop_pct,-15), span = TP-lo, at = v => Math.max(0,Math.min(100,(v-lo)/span*100));
    const colr = p.last_pct>=0 ? "var(--up)" : "var(--down)", age = Math.round((Date.now()-T(p.entry_time))/60000);
    return `<div class="pos"><div class="prow"><div style="min-width:0"><div class="pname">${esc(p.name)}</div>
      <div class="pmeta">#${p.id} · ${fH(p.entry_time)} · ${age}′ · ${esc(p.dex||"")}</div></div>
      <div class="big ${cls(p.last_pct)}">${pct(p.last_pct)}</div></div>
      <div class="track"><span class="zero" style="left:${at(0)}%"></span><span class="peak" style="left:${at(p.peak_pct)}%"></span>
      <span class="cur" style="left:${at(p.last_pct)}%;background:${colr};color:${colr}"></span></div>
      <div class="tlbl"><span>stop ${pct(p.stop_pct)}</span><span>κορυφή ${pct(p.peak_pct)}</span><span>+${TP}%</span></div></div>`;
  }).join("") : `<div class="empty">Καμία ανοιχτή θέση — ο Scout ψάχνει.</div>`;
}
function renderRules(st){
  const rj = Object.entries(st.stats.rejects||{}).sort((a,b)=>b[1]-a[1]).slice(0,8);
  $("rules").innerHTML = rj.map(([r,n])=>`<div class="rule"><span>${esc(r)}</span><b class="num">${fmtInt(n)}</b></div>`).join("") || `<div class="empty">—</div>`;
  const c = st.closed;
  $("bw").innerHTML = c.length ? `best <span class="up">${usd(Math.max(...c.map(t=>t.pnl)))}</span> · worst <span class="down">${usd(Math.min(...c.map(t=>t.pnl)))}</span>` : "";
}
function renderGauges(st){
  const c = st.closed, w = c.filter(t=>t.pnl>0), l = c.filter(t=>t.pnl<=0);
  const gw = w.reduce((a,t)=>a+t.pnl,0), gl = -l.reduce((a,t)=>a+t.pnl,0);
  let peak = st.start_balance, mdd = 0; for(const [,v] of st.equity_history){ peak=Math.max(peak,v); mdd=Math.max(mdd,(peak-v)/peak); }
  const pf = gl>0 ? (gw/gl).toFixed(2) : gw>0 ? "∞" : "—";
  const G = [
    [c.length ? Math.round(100*w.length/c.length)+"%" : "—", `Επιτυχία · ${w.length}/${c.length}`, w.length/Math.max(c.length,1)>=.5?"up":"down"],
    [pf, "Profit factor", gl>0&&gw/gl>=1?"up":"down"],
    [c.length ? usd((gw-gl)/c.length) : "—", "Μέσο ανά trade", cls(gw-gl)],
    [mdd ? "−"+(mdd*100).toFixed(1)+"%" : "0%", "Μέγιστη πτώση", "down"],
  ];
  $("gauges").innerHTML = G.map(([v,k,cl])=>`<div class="g"><div class="v ${c.length?cl:""}">${v}</div><div class="k">${k}</div></div>`).join("");
}
function renderClosed(){
  const c = ST.closed.slice().reverse().filter(t => filt==="all" || (filt==="w" ? t.pnl>0 : t.pnl<=0));
  const list = showAll ? c : c.slice(0,10);
  $("closed").innerHTML = list.length ? list.map(t=>`<div class="tr ${t.pnl>0?"w":"l"}"><div class="sd"></div>
      <div><div class="pname">${esc(t.name)}</div><div class="pmeta">${fT(t.exit_time)} · ${Math.round(t.hold_min)}′ · ${esc(t.reason)}</div></div>
      <div class="r"><span class="num ${cls(t.pnl)}">${usd(t.pnl)}</span><span class="num pmeta">${pct(t.pnl_pct)}</span></div></div>`).join("")
    + (c.length>10 ? `<button class="more" id="more">${showAll?"Λιγότερα":"Όλα ("+c.length+")"}</button>` : "")
    : `<div class="empty">Τίποτα εδώ ακόμα.</div>`;
  const mb = $("more"); if(mb) mb.onclick = () => { showAll=!showAll; renderClosed(); };
}

/* ---------- main render ---------- */
function render(st){
  ST = st;
  const eq = equity(st), start = st.start_balance, pnl = eq-start, mult = eq/start;
  const age = (Date.now()-T(st.last_run))/60000;
  $("live").className = "live" + (age>20 ? " bad" : age>10 ? " warn" : "");
  $("livet").textContent = age>20 ? `Σταματημένο · ${Math.round(age)}′` : age<2 ? "Live" : `Live · ${Math.round(age)}′`;

  tick("eq", eq, v=>"$"+v.toFixed(2));
  $("eq").className = "eq num " + cls(pnl);
  $("sub").innerHTML = `<span class="${cls(pnl)}">${usd(pnl)} (${pct(100*pnl/start)})</span> <span class="mut">από $${start.toFixed(0)}</span>`;
  const mEl = $("mult"); mEl.className = "pill " + (mult>=1?"g":"r"); mEl.querySelector("span").textContent = mult.toFixed(2)+"×";
  const lt = st.closed[st.closed.length-1], lEl = $("lastp");
  if(lt){
    const changed = PREV && PREV.closed.length && PREV.closed[PREV.closed.length-1].id !== lt.id;
    lEl.className = "pill " + (lt.pnl>0?"g":"r") + (changed?" flip":"");
    lEl.querySelector("span").textContent = usd(lt.pnl);
  }
  drawCurve();

  const rejected = Object.values(st.stats.rejects||{}).reduce((a,n)=>a+n,0);
  tick("fScan", st.stats.pools_checked, fmtInt);
  tick("fRej", rejected, fmtInt);
  tick("fPass", st.closed.length + st.positions.length, fmtInt);

  renderAgents(st); renderOpen(st); renderConsole(st); renderRules(st); renderGauges(st); drawBars(); renderClosed();
  announce(st);

  $("foot").innerHTML = `Εικονικό κεφάλαιο · ξεκίνησε ${fT(st.started_at)} · ενημερώνεται μόνο του<br>
    <a href="https://github.com/${OWNER}/${REPO}/blob/main/docs/trades.csv">Όλα τα trades</a> · <a href="https://github.com/${OWNER}/${REPO}">Repo</a>`;
  PREV = st; first = false;
}

async function fetchState(){
  if(LOCAL){ const r = await fetch("state.json?t="+Date.now()); return r.json(); }
  try{ // GitHub API: πάντα φρέσκο
    const r = await fetch(API, {headers:{Accept:"application/vnd.github.raw+json"}, cache:"no-store"});
    if(r.ok) return r.json();
  }catch(e){}
  const r = await fetch(RAW + "?t=" + Date.now(), {cache:"no-store"}); // εφεδρικό
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
let lastRun = null;
async function load(){
  try{
    const st = await fetchState();
    if(st.last_run !== lastRun || first){ lastRun = st.last_run; render(st); }
    else { const age = (Date.now()-T(st.last_run))/60000; $("livet").textContent = age<2 ? "Live" : `Live · ${Math.round(age)}′`; }
    $("err").style.display = "none";
  }catch(e){
    $("err").style.display = "block";
    $("err").textContent = ST ? "Δεν ήρθαν νέα δεδομένα — δείχνω τα τελευταία." : "Δεν βρέθηκαν δεδομένα ακόμα.";
  }
}

$("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
  range = +b.dataset.r; for(const x of $("tabs").children) x.classList.toggle("on", x===b); drawCurve(); });
$("filters").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return;
  filt = b.dataset.f; showAll = false; for(const x of $("filters").children) x.classList.toggle("on", x===b); renderClosed(); });
const ro = new ResizeObserver(() => { drawCurve(); drawBars(); });
ro.observe($("curve")); ro.observe($("pnlbars"));
load(); setInterval(load, POLL);
document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
}
</script>
</body>
</html>
